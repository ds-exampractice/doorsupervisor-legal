<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</helmet>
<header style="position:sticky;top:0;z-index:1000;background:color-mix(in srgb, var(--bg) 82%, transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border)">
  <div style="max-width:1200px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px">

    <a href="Home.html" style="display:flex;align-items:center;gap:12px;text-decoration:none;flex:none">
      <img src="ic_launcher.png" alt="Door Supervisor Exam Practice" style="width:38px;height:38px;border-radius:10px;display:block;box-shadow:0 4px 14px -4px rgba(0,0,0,.5)">
      <span style="display:flex;flex-direction:column;line-height:1.05">
        <span style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;color:var(--text);letter-spacing:-.01em;white-space:nowrap">Door Supervisor</span>
        <span style="font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.22em;color:var(--text-dim);text-transform:uppercase;margin-top:2px">Exam Practice</span>
      </span>
    </a>

    <sc-if value="{{ inlineLinks }}" hint-placeholder-val="{{ true }}">
      <nav style="display:flex;align-items:center;gap:30px">
        <sc-for list="{{ links }}" as="lnk" hint-placeholder-count="5">
          <a href="{{ lnk.href }}" style="{{ lnk.style }}">{{ lnk.label }}</a>
        </sc-for>
      </nav>
    </sc-if>

    <div style="display:flex;align-items:center;gap:10px;flex:none">
      <sc-if value="{{ inlineLinks }}" hint-placeholder-val="{{ true }}">
        <button onClick="{{ toggleTheme }}" aria-label="Toggle theme" style="width:42px;height:42px;border-radius:10px;border:1px solid var(--border);background:var(--bg-elev);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:border-color .2s" style-hover="border-color:var(--border-strong)">
          <sc-if value="{{ isDark }}" hint-placeholder-val="{{ true }}">
            <span style="position:relative;width:17px;height:17px;display:block">
              <span style="position:absolute;inset:0;border-radius:50%;background:var(--text)"></span>
              <span style="position:absolute;top:-3px;right:-3px;width:14px;height:14px;border-radius:50%;background:var(--bg-elev)"></span>
            </span>
          </sc-if>
          <sc-if value="{{ isLight }}" hint-placeholder-val="{{ false }}">
            <span style="width:14px;height:14px;border-radius:50%;background:var(--text);box-shadow:0 0 0 3px color-mix(in srgb, var(--text) 22%, transparent)"></span>
          </sc-if>
        </button>
        <a href="https://play.google.com/store/apps/details?id=com.saabbventures.dsexampractice" target="_blank" style="display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;font-size:13.5px;padding:10px 18px;border-radius:10px;letter-spacing:.01em;box-shadow:0 8px 22px -10px var(--accent);transition:transform .2s" style-hover="transform:translateY(-1px)">Get the App</a>
      </sc-if>

      <sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
        <button onClick="{{ toggleMenu }}" aria-label="{{ menuLabel }}" style="width:44px;height:44px;border-radius:10px;border:1px solid var(--border);background:var(--bg-elev);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0">
          <span style="width:16px;height:1.5px;background:var(--text);display:block"></span>
          <span style="width:16px;height:1.5px;background:var(--text);display:block"></span>
          <span style="width:16px;height:1.5px;background:var(--text);display:block"></span>
        </button>
      </sc-if>
    </div>
  </div>

  <sc-if value="{{ showMenu }}" hint-placeholder-val="{{ false }}">
    <div style="border-top:1px solid var(--border);background:var(--bg-soft);padding:8px 24px 20px">
      <sc-for list="{{ links }}" as="lnk" hint-placeholder-count="5">
        <a href="{{ lnk.href }}" style="{{ lnk.mobileStyle }}">{{ lnk.label }}</a>
      </sc-for>
      <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:12px">
        <button onClick="{{ toggleTheme }}" aria-label="Toggle theme" style="width:44px;height:44px;border-radius:10px;border:1px solid var(--border);background:var(--bg-elev);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;flex:none">
          <sc-if value="{{ isDark }}" hint-placeholder-val="{{ true }}">
            <span style="position:relative;width:17px;height:17px;display:block">
              <span style="position:absolute;inset:0;border-radius:50%;background:var(--text)"></span>
              <span style="position:absolute;top:-3px;right:-3px;width:14px;height:14px;border-radius:50%;background:var(--bg-elev)"></span>
            </span>
          </sc-if>
          <sc-if value="{{ isLight }}" hint-placeholder-val="{{ false }}">
            <span style="width:14px;height:14px;border-radius:50%;background:var(--text);box-shadow:0 0 0 3px color-mix(in srgb, var(--text) 22%, transparent)"></span>
          </sc-if>
        </button>
        <a href="https://play.google.com/store/apps/details?id=com.saabbventures.dsexampractice" target="_blank" style="flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;font-size:14px;padding:13px 18px;border-radius:10px;box-shadow:0 8px 22px -10px var(--accent)">Get the App</a>
      </div>
    </div>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:140},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;roles&quot;,&quot;privacy&quot;,&quot;terms&quot;,&quot;deletion&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { theme: 'dark', menuOpen: false, narrow: false };

  themes() {
    return {
      dark: {
        '--bg': '#0a0e1a', '--bg-soft': '#0e1322', '--bg-elev': '#131a2c',
        '--panel': 'rgba(255,255,255,0.03)',
        '--border': 'rgba(255,255,255,0.09)', '--border-strong': 'rgba(255,255,255,0.17)',
        '--text': '#eef1f7', '--text-mut': '#9aa4ba', '--text-dim': '#66708a',
        '--accent': '#5c8fd6', '--accent-strong': '#79a6e6', '--accent-soft': 'rgba(92,143,214,0.13)',
        '--shadow': '0 24px 60px -28px rgba(0,0,0,0.75)', '--grid': 'rgba(255,255,255,0.045)'
      },
      light: {
        '--bg': '#f5f6f9', '--bg-soft': '#ffffff', '--bg-elev': '#ffffff',
        '--panel': 'rgba(16,24,40,0.015)',
        '--border': 'rgba(16,24,40,0.10)', '--border-strong': 'rgba(16,24,40,0.20)',
        '--text': '#111726', '--text-mut': '#51607a', '--text-dim': '#8893a8',
        '--accent': '#2f5fa3', '--accent-strong': '#234d8a', '--accent-soft': 'rgba(47,95,163,0.07)',
        '--shadow': '0 20px 44px -26px rgba(16,24,40,0.32)', '--grid': 'rgba(16,24,40,0.05)'
      }
    };
  }

  applyTheme(theme) {
    const v = this.themes()[theme] || this.themes().dark;
    const r = document.documentElement;
    for (const k in v) r.style.setProperty(k, v[k]);
    r.style.colorScheme = theme === 'light' ? 'light' : 'dark';
    r.style.background = v['--bg'];
  }

  componentDidMount() {
    const saved = localStorage.getItem('ds-theme') || 'dark';
    this.applyTheme(saved);
    this.setState({ theme: saved, narrow: window.innerWidth < 880 });
    this._onResize = () => {
      const narrow = window.innerWidth < 880;
      this.setState(s => ({ narrow, menuOpen: narrow ? s.menuOpen : false }));
    };
    window.addEventListener('resize', this._onResize);
  }
  componentWillUnmount() { window.removeEventListener('resize', this._onResize); }

  toggleTheme() {
    const t = this.state.theme === 'dark' ? 'light' : 'dark';
    localStorage.setItem('ds-theme', t);
    this.applyTheme(t);
    this.setState({ theme: t });
  }

  renderVals() {
    const A = this.props.active;
    const base = { textDecoration: 'none', color: 'var(--text-mut)', fontSize: '14px', fontWeight: 500, letterSpacing: '.005em', transition: 'color .2s', paddingBottom: '3px', borderBottom: '1.5px solid transparent' };
    const act = { ...base, color: 'var(--text)', borderBottom: '1.5px solid var(--accent)' };
    const mob = { display: 'block', textDecoration: 'none', color: 'var(--text-mut)', fontSize: '15px', fontWeight: 500, padding: '12px 4px', borderBottom: '1px solid var(--border)' };
    const mobAct = { ...mob, color: 'var(--text)' };
    const items = [
      { k: 'home', label: 'Home', href: 'Home.html' },
      { k: 'roles', label: 'Job Roles', href: 'JobRoles.html' },
      { k: 'privacy', label: 'Privacy', href: 'privacy-policy.html' },
      { k: 'terms', label: 'Terms', href: 'terms-and-conditions.html' },
      { k: 'deletion', label: 'Data Deletion', href: 'data-deletion.html' },
      { k: 'contact', label: 'Contact', href: 'contact.html' }
    ];
    const links = items.map(it => ({
      href: it.href, label: it.label,
      style: A === it.k ? act : base,
      mobileStyle: A === it.k ? mobAct : mob
    }));
    return {
      links,
      isDark: this.state.theme === 'dark',
      isLight: this.state.theme === 'light',
      narrow: this.state.narrow,
      inlineLinks: !this.state.narrow,
      showMenu: this.state.narrow && this.state.menuOpen,
      menuLabel: this.state.menuOpen ? 'Close menu' : 'Open menu',
      toggleTheme: () => this.toggleTheme(),
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen }))
    };
  }
}
</script>
</body>
</html>
